[package]
name = "tally-todo"
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Make TODO management a little more automatic"
repository = "https://github.com/what386/tally"
keywords = ["todo", "tasks", "cli", "productivity"]
categories = ["command-line-utilities", "development-tools"]

exclude = [".github", "scripts/", "completions/"]

[features]
default = []
shell-completions = ["dep:clap_complete"]

[[bin]]
name = "completions"
path = "src/completions.rs"
required-features = ["shell-completions"]

[[bin]]
name = "tally"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
clap_complete = { version = "4.6", optional = true }
dirs = "7.0.0"
fuzzy-matcher = "0.3.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
